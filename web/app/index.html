<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zuno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body>
  <div class="app-shell">
    <div class="app-tabs" role="tablist" aria-label="Servers">
      <span class="app-tab" role="tab" aria-selected="true"><span class="brand-mark" aria-hidden="true">+</span>Add a server</span>
    </div>
    <main class="app-body">
      <form class="connect" onsubmit="return false">
        <h1>Join a server</h1>
        <p>Paste the address the server owner gave you.</p>
        <div class="field">
          <label for="address">Server address</label>
          <input id="address" name="address" type="text" inputmode="url" autocomplete="off" placeholder="my-server.at.ply.gg:41234">
        </div>
        <button class="btn btn-primary" type="submit" disabled>Connect</button>
        <p class="notice">The web client is under construction. Connecting isn't possible yet.</p>
        <p class="hint"><a href="../">Back to the Zuno homepage</a></p>
      </form>
    </main>
  </div>
</body>
</html>
