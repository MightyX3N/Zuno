<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zuno</title>
  <meta name="theme-color" content="#e6e4dd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../assets/theme.js"></script>
</head>
<body>
  <div class="app-shell">
    <div class="app-tabs" role="tablist" aria-label="Servers">
      <span class="app-tab" role="tab" aria-selected="true"><span class="brand-mark" aria-hidden="true">+</span>Add a server</span>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
        <svg class="sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="3.5"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6L16 16M4 16l1.4-1.4M14.6 5.4L16 4"/></svg>
        <svg class="moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 12.5A7 7 0 0 1 7.5 3.5a7 7 0 1 0 9 9z"/></svg>
      </button>
    </div>
    <main class="app-body">
      <form class="connect" onsubmit="return false">
        <h1>Join a server</h1>
        <p>Paste the address the server owner gave you.</p>
        <div class="field">
          <label for="address">Server address</label>
          <input id="address" name="address" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="my-server.at.ply.gg:41234">
        </div>
        <button class="btn btn-primary" type="submit" disabled>Connect</button>
        <p class="notice">The web client is under construction. Connecting isn't possible yet.</p>
        <p class="hint"><a href="../">Back to the Zuno homepage</a></p>
      </form>
    </main>
  </div>
</body>
</html>
